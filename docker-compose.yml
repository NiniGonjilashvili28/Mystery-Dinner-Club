# Runs the whole system on your computer with: docker compose up --build
# Passwords and the secret key come from the .env file (never committed).

services:
  # SQL Server: one server that holds both databases (restaurants and bookings).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # SQL Server only exists for Intel chips; Rosetta runs it on the M2
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql     # keeps the data when the container is recreated
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-off job: creates the two databases and one login per service, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      RESTAURANTS_DB_PASSWORD: ${RESTAURANTS_DB_PASSWORD}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init.sql
        -v RESTAURANTS_DB_PASSWORD="$$RESTAURANTS_DB_PASSWORD" BOOKINGS_DB_PASSWORD="$$BOOKINGS_DB_PASSWORD"
    restart: "no"

  # Restaurants service: cities, matching and restaurant details. Uses only its own database.
  restaurants:
    build: ./services/restaurants
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://restaurants_user:${RESTAURANTS_DB_PASSWORD}@db:1433/restaurants
      ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8001:8000"

  # Bookings service: accounts, bookings, ratings. Uses only its own database
  # and asks the Restaurants service over HTTP (address below, 3-second timeout).
  bookings:
    build: ./services/bookings
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://bookings_user:${BOOKINGS_DB_PASSWORD}@db:1433/bookings
      SECRET_KEY: ${SECRET_KEY}
      RESTAURANTS_URL: http://restaurants:8000
      RESTAURANTS_TIMEOUT_S: "3"
      ALLOWED_ORIGIN: http://localhost:8080
    ports:
      - "8002:8000"

  # The website: a stock nginx serving the files in ui/ (no Dockerfile of our own).
  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  db-data:
