# Starts the whole Mystery Dinner Club system locally: docker compose up --build
services:

  # One SQL Server holding one database per service (local only; Azure uses Azure SQL).
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Runs db/init.sql once to create the two databases and their logins, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      RESTAURANTS_DB_PASSWORD: ${RESTAURANTS_DB_PASSWORD}
      BOOKINGS_DB_PASSWORD: ${BOOKINGS_DB_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init.sql
        -v RESTAURANTS_DB_PASSWORD="$$RESTAURANTS_DB_PASSWORD" BOOKINGS_DB_PASSWORD="$$BOOKINGS_DB_PASSWORD"
    restart: "no"

volumes:
  db-data: