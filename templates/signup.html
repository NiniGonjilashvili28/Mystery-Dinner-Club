{% extends "base.html" %}
{% block content %}
<h2>Sign up</h2>
<form method="post">
    <label>Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password (at least 8 characters) <input name="password" type="password" required></label>
    <button type="submit">Create my account</button>
</form>
{% endblock %}
